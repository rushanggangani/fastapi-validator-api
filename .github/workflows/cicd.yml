name: Deploy Backend API

on:
  push:
    branches:
      - main
  # pull_request:
  #   branches:
  #     - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Docker login
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build and push docker image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/fastapi-server:latest .
        docker push ${{ secrets.DOCKER_USERNAME }}/fastapi-server:latest
    - name: connect to EC2 and restart server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_IP_ADDRESS }}
        username: ubuntu  
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/fastapi-server:latest
          docker stop my-api || true
          docker rm my-api || true
          docker run -d -p 8000:8000 --name my-api ${{ secrets.DOCKER_USERNAME }}/fastapi-server:latest